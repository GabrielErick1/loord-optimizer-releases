<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loord Crosshair Overlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      background: transparent !important;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
    }
    #crosshair-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: opacity 0.15s ease-out;
    }
    #crosshair-svg-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    #crosshair-svg-wrap svg,
    #crosshair-svg-wrap img {
      display: block;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="crosshair-container" style="display: none;">
    <div id="crosshair-svg-wrap"></div>
  </div>

  <script>
    const container = document.getElementById('crosshair-container');
    const svgWrap = document.getElementById('crosshair-svg-wrap');

    // As 11 Miras Vetoriais Oficiais Loord (viewBox 128x128, centro 64,64)
    const LOORD_CROSSHAIRS = {
      'dot': `<circle cx="64" cy="64" r="5" fill="currentColor"/>`,
      'cross-thin': `<g stroke="currentColor" stroke-width="2.5"><line x1="28" y1="64" x2="100" y2="64"/><line x1="64" y1="28" x2="64" y2="100"/></g>`,
      'cross-gap': `<g stroke="currentColor" stroke-width="2.5"><line x1="28" y1="64" x2="54" y2="64"/><line x1="74" y1="64" x2="100" y2="64"/><line x1="64" y1="28" x2="64" y2="54"/><line x1="64" y1="74" x2="64" y2="100"/></g>`,
      'circle': `<circle cx="64" cy="64" r="26" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="64" cy="64" r="3" fill="currentColor"/>`,
      't-inverted': `<g stroke="currentColor" stroke-width="2.5"><line x1="32" y1="64" x2="96" y2="64"/><line x1="64" y1="32" x2="64" y2="64"/></g>`,
      'double-cross': `<g stroke="currentColor" fill="none"><g stroke-width="2"><line x1="18" y1="64" x2="110" y2="64"/><line x1="64" y1="18" x2="64" y2="110"/></g><g stroke-width="4"><line x1="46" y1="64" x2="82" y2="64"/><line x1="64" y1="46" x2="64" y2="82"/></g></g>`,
      'dot-ring': `<circle cx="64" cy="64" r="22" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="64" cy="64" r="6" fill="currentColor"/>`,
      'x-diagonal': `<g stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="36" y1="36" x2="92" y2="92"/><line x1="92" y1="36" x2="36" y2="92"/></g>`,
      'chevron': `<g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><polyline points="36,64 64,36 92,64"/><polyline points="36,88 64,60 92,88"/></g>`,
      'star': `<polygon points="64,24 74,54 104,64 74,74 64,104 54,74 24,64 54,54" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>`
    };

    function renderCrosshair(cfg) {
      if (!cfg || !cfg.enabled) {
        container.style.display = 'none';
        return;
      }

      container.style.display = 'flex';
      container.style.opacity = (cfg.opacity ?? 100) / 100;
      
      const offsetX = cfg.offsetX || 0;
      const offsetY = cfg.offsetY || 0;
      container.style.transform = `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px))`;

      const color = cfg.color || '#38bdf8';
      const size = cfg.size || 36;
      const outline = cfg.outline ? `drop-shadow(0 0 ${cfg.outlineWidth || 1}px ${cfg.outlineColor || '#000000'}) drop-shadow(0 0 2px ${cfg.outlineColor || '#000000'})` : 'none';

      if (cfg.type === 'custom' && cfg.customImage) {
        svgWrap.innerHTML = `<img src="${cfg.customImage}" style="width: ${size}px; height: ${size}px; filter: ${outline}; object-fit: contain;">`;
      } else {
        const shape = cfg.shape || 'dot';
        const innerSvg = LOORD_CROSSHAIRS[shape] || LOORD_CROSSHAIRS['dot'];
        svgWrap.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 128 128" preserveAspectRatio="none" style="color: ${color}; filter: ${outline};">
            ${innerSvg}
          </svg>
        `;
      }
    }

    if (window.api && window.api.onOverlayRender) {
      window.api.onOverlayRender((cfg) => {
        renderCrosshair(cfg);
      });
    }

    // Inicialização
    if (window.api && window.api.getOverlayConfig) {
      window.api.getOverlayConfig().then(renderCrosshair).catch(() => {});
    }
  </script>
</body>
</html>
